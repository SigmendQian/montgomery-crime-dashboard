[project]
name = "montgomery-county-crime-dashboard"
version = "2.0.0"
description = "Remote-only Montgomery County crime analysis and forecasting"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.41,<2",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "plotly>=5.24,<8",
    "pydeck>=0.9,<1",
    "scikit-learn>=1.5,<2",
    "requests>=2.32,<3",
    "urllib3>=2.2,<3",
    "threadpoolctl>=3.5,<4",
    "tzdata>=2024.1",
]
